target: Qwen/Qwen3-4B
draft: Qwen/Qwen3-1.7B
device: cuda
dtype: bfloat16
mapper:
  calibration_dataset: FineWeb-Edu
  sequences: 500
  sequence_length: 1024
  observation_stride: 4
  ridge_lambda: 0.01
  source_layers_per_draft_layer: 8
pilot:
  prompts: 200
  gamma: 4
  generated_tokens: 512
  context_lengths: [512, 1024, 2048, 4096, 8192, 16384]
  warmup: 20
  repetitions: 100
training:
  dataset: FineWeb-Edu-disjoint-from-calibration
  prefixes: 2000
  context_lengths: [512, 1024, 2048]
  gamma: 4
  batch_size: 1
  gradient_accumulation: 16
  residual_rank: 8
  learning_rate: 0.0002
  weight_decay: 0.0001
  gradient_clip: 1.0
  steps: 500
  max_steps: 1000
  precision: bfloat16
  lambda_reg: 0.001
  optimizer: AdamW
  gate_initialization: 0.0
  save_every: 100
