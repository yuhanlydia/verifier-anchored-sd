[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifier-anchored-sd"
version = "0.1.0"
description = "Exact speculative decoding with verifier-anchored translated draft KV caches"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "pyyaml>=6.0", "tqdm>=4.66"]

[project.optional-dependencies]
hf = ["transformers>=4.51", "datasets>=3.0", "accelerate>=1.0"]
kvbridge = ["kvbridge @ git+https://github.com/Yunbo-max/kvbridge.git@0d75f31dcde6eeceaa609d3affed6ca1401deb77"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
